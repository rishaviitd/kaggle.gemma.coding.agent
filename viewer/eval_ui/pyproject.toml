[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4-agent-eval"
version = "1.0.0"
description = "Offline, evidence-linked coding-agent trace analytics"
requires-python = ">=3.11"
dependencies = ["pandas>=1.5", "plotly>=5.18", "ipywidgets>=8", "jsonschema>=4", "nbformat>=5", "anywidget>=0.9"]

[project.optional-dependencies]
test = ["pytest>=7", "nbclient>=0.10", "ipykernel>=6"]
parquet = ["pyarrow>=12"]
notebook = ["jupyterlab>=4", "ipykernel>=6"]

[project.scripts]
agent-eval = "agent_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
"agent_eval.plots" = ["*.html"]
