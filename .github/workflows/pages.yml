name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - presentation/**
      - logs/remote/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp -R presentation _site/presentation
          mkdir -p _site/data
          cp data/tasks.jsonl _site/data/tasks.jsonl
          mkdir -p _site/logs
          cp -R logs/remote _site/logs/remote
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("logs/remote")
          site = Path("_site")
          iterations = {}
          for iteration_dir in sorted(root.iterdir()):
              if not iteration_dir.is_dir() or (
                  iteration_dir.name != "base" and not iteration_dir.name.startswith("iteration-")
              ):
                  continue
              iteration = iterations.setdefault(
                  iteration_dir.name, {name: [] for name in ("train", "dev", "val")}
              )
              for split in ("train",):
                  for trace_path in sorted((iteration_dir / split).glob("*/model_trace.json")):
                      try:
                          trace = json.loads(trace_path.read_text(encoding="utf-8"))
                      except (OSError, json.JSONDecodeError):
                          continue
                      result = trace.get("final", {}).get("result", {})
                      resolved = result.get("resolved") if isinstance(result, dict) else None
                      iteration[split].append({
                          "task_id": trace.get("run", {}).get("task_id", trace_path.parent.name),
                          "resolved": resolved if isinstance(resolved, bool) else None,
                          "trace_path": trace_path.as_posix(),
                      })
          (site / "trace-index.json").write_text(
              json.dumps({"iterations": iterations}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
