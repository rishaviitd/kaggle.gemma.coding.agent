name: Deploy presentation to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - trace-formats.js
      - scripts/build_trace_index.py
      - presentation/**
      - logs/remote/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp trace-formats.js _site/trace-formats.js
          cp -R presentation _site/presentation
          mkdir -p _site/data
          cp data/tasks.jsonl _site/data/tasks.jsonl
          mkdir -p _site/logs
          cp -R logs/remote _site/logs/remote
          python3 scripts/build_trace_index.py --output _site/trace-index.json
          sed -i "s/__BUILD_VERSION__/${GITHUB_SHA}/g" _site/index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
