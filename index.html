<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <title>Gemma 4 Developer Agent — Presentation</title>
    <style>
      :root {
        /* Shared deck theme: change these once to restyle every slide. */
        --color-bg: #0d1117;
        --color-panel: #161b22;
        --color-fg: #f0f4fa;
        --color-muted: #a8b1bd;
        --color-green: #32765a;
        --color-red: #f2392c;
        --color-blue: #438de8;
        --color-rule: #30363d;
        --font-body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --font-mono: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        background: var(--color-bg);
        color: var(--color-fg);
        font-family: var(--font-body);
      }
      .deck {
        display: block;
        width: 100vw;
        height: 100vh;
      }
      .slide {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        height: 100%;
        overflow: hidden;
        padding: clamp(32px, 8vw, 120px);
        background: var(--color-bg);
      }
      .slide__eyebrow {
        margin: 0 0 18px;
        color: var(--color-green);
        font-size: clamp(13px, 1.2vw, 18px);
        font-weight: 700;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      .slide__title {
        max-width: 980px;
        margin: 0;
        font-size: clamp(42px, 6.4vw, 88px);
        line-height: 1.02;
        letter-spacing: -.045em;
      }
      .slide__rule {
        width: 100%;
        height: 1px;
        margin: 28px 0;
        border: 0;
        background: var(--color-rule);
      }
      .slide__body {
        max-width: 800px;
        margin: 0;
        color: var(--color-muted);
        font-size: clamp(19px, 2vw, 28px);
        line-height: 1.55;
      }
      .slide__points {
        display: grid;
        gap: 16px;
        margin: 0;
        padding-left: 1.25em;
        color: var(--color-muted);
        font-size: clamp(20px, 2vw, 28px);
        line-height: 1.4;
      }
      .slide__points li::marker { color: var(--color-green); }
      .slide__footer {
        display: flex;
        justify-content: space-between;
        margin-top: auto;
        padding-top: 24px;
        color: var(--color-muted);
        font-family: var(--font-mono);
        font-size: 13px;
      }
      .slide__accent { color: var(--color-red); }
      @media (max-width: 640px) {
        .slide { padding: 32px 24px; }
        .slide__points { gap: 12px; font-size: 18px; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Lightweight React templating: no local install or build step. -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="text/babel">
      const { createElement: h } = React;

      function Slide({ eyebrow, title, points, number, total }) {
        return h("main", { className: "deck" },
          h("section", { className: "slide" },
            eyebrow && h("p", { className: "slide__eyebrow" }, eyebrow),
            h("h1", { className: "slide__title" }, title),
            h("hr", { className: "slide__rule" }),
            h("ol", { className: "slide__points" }, points.map((point) => h("li", { key: point }, point))),
            h("footer", { className: "slide__footer" },
              h("span", null, "GEMMA 4 · DEVELOPER AGENT"),
              h("span", null, `${number} / ${total}`)
            )
          )
        );
      }

      function App() {
        const [active, setActive] = React.useState(0);
        const slides = [
          {
            eyebrow: "Overview · What to do",
            title: "Build a useful coding agent",
            points: [
              "Post-train Gemma 4 with reinforcement learning.",
              "Use harness tools to inspect code and make changes.",
              "Test fixes against real software issues."
            ]
          },
          {
            eyebrow: "Overview · What not to do",
            title: "Avoid unreliable shortcuts",
            points: [
              "Don’t rely on unsupported internet access at runtime.",
              "Don’t submit without checking the required format.",
              "Don’t assume a patch works without running tests."
            ]
          }
        ];
        React.useEffect(() => {
          function onKeyDown(event) {
            if (event.key === "ArrowRight") setActive((i) => Math.min(i + 1, slides.length - 1));
            if (event.key === "ArrowLeft") setActive((i) => Math.max(i - 1, 0));
          }
          window.addEventListener("keydown", onKeyDown);
          return () => window.removeEventListener("keydown", onKeyDown);
        }, []);
        const slide = slides[active];
        return h(Slide, {
          ...slide,
          number: active + 1,
          total: slides.length,
        });
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
