<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#E9E6DD" />
    <title>Gemma 4 Developer Agent — Presentation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Chewy&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="presentation/styles.css?v=__BUILD_VERSION__" />
  </head>
  <body>
    <div id="root"></div>

    <!-- React is CDN-loaded to avoid a local install or build step. -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="presentation/components.js?v=__BUILD_VERSION__"></script>
    <script src="presentation/slides/what-to-do.js?v=__BUILD_VERSION__"></script>
    <script src="presentation/slides/what-not-to-do.js?v=__BUILD_VERSION__"></script>
    <script>
      const h = React.createElement;
      const slides = [window.WhatToDoSlide, window.WhatNotToDoSlide];

      function App() {
        const [active, setActive] = React.useState(0);

        React.useEffect(() => {
          function onKeyDown(event) {
            if (event.key === "ArrowRight") setActive((index) => Math.min(index + 1, slides.length - 1));
            if (event.key === "ArrowLeft") setActive((index) => Math.max(index - 1, 0));
          }
          window.addEventListener("keydown", onKeyDown);
          return () => window.removeEventListener("keydown", onKeyDown);
        }, []);

        return h(slides[active], { number: active + 1, total: slides.length });
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
